<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;padding:10px 12px;background:#12151a;color:#e4e7eb;font:13px/1.3 system-ui,sans-serif}
h2{margin:10px 0 3px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8a94a0}
h2:first-child{margin-top:0}
.t{display:flex;justify-content:space-between;gap:8px}
.t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t b{font-weight:600;color:#aeb7c2}
.r{margin:4px 0}
.b{height:5px;margin-top:2px;border-radius:3px;background:#242a33;overflow:hidden}
.b i{display:block;height:100%;background:#4c8dff}
.s-d i{background:#3fb97b}
.s-f i{background:#e5534b}
.s-b i{background:#d9a441}
.s-q i{background:#5b6573}
.j .t em{font-style:normal;font-size:11px;color:#8a94a0}
.l{margin-top:10px;padding-top:6px;border-top:1px solid #242a33;font-size:11px;color:#8a94a0}
</style>
<div id="a"></div>
<script>
const root = document.getElementById('a')
const STATE = { r: 'run', q: 'queue', d: 'done', f: 'fail', b: 'block' }
const el = (tag, cls, text) => {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (text !== undefined) e.textContent = text
  return e
}
const pct = (v) => Math.max(0, Math.min(100, Math.round(Number(v) || 0)))
const row = (cls, name, v, extra) => {
  const r = el('div', 'r ' + cls)
  const t = el('div', 't')
  t.append(el('span', '', name), extra || el('b', '', pct(v) + '%'))
  const bar = el('div', 'b')
  const fill = el('i')
  fill.style.width = pct(v) + '%'
  bar.append(fill)
  r.append(t, bar)
  return r
}
const render = () => {
  let d = {}
  try {
    d = JSON.parse(TelegramWidget.chatData || '{}') || {}
  } catch (e) {}
  root.textContent = ''
  for (const g of d.m || []) {
    root.append(el('h2', '', g[0]))
    for (const r of g[1] || []) root.append(row('', r[0], r[1]))
  }
  if ((d.j || []).length) root.append(el('h2', '', 'jobs'))
  for (const j of d.j || []) {
    const s = el('em', '', pct(j[1]) + '% ' + (STATE[j[2]] || ''))
    root.append(row('j s-' + j[2], j[0], j[1], s))
  }
  if (d.l) root.append(el('div', 'l', d.l))
}
render()
// Re-render whenever the bot changes the state via editMessageWidgetData.
if (typeof TelegramWidget.addEventListener === 'function') {
  TelegramWidget.addEventListener('chatDataChanged', render)
}
window.addEventListener('chatDataChanged', render)
</script>
