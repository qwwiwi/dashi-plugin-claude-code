# Permission gate policy — Variant 1 (recommended: smooth autonomy).
#
# The owner drives this Claude Code session from Telegram. The session runs
# under `--permission-mode bypassPermissions`, so NO Allow/Deny prompt ever
# appears in the terminal. This file is the only gate. Copy it to your
# workspace as `chats/permission-policy.yaml` (or point
# TELEGRAM_PERMISSION_POLICY_PATH at it) and tune the lists.
#
# Tiers (precedence: deny > confirm > allow > default_tier):
#   deny    — blocked hard, never reaches you.
#   confirm — you get an Allow/Deny button in Telegram; 2-min timeout = deny.
#   allow   — runs silently.
#
# A built-in hard-deny ALWAYS fires regardless of this file: reads/writes of
# .env, *.pem, *.key, .ssh, .aws, gcloud, /proc/*/environ, and catastrophic
# shell (rm -rf /, fork bombs, mkfs, dd to a disk), and force push in any
# spelling (git-force-push). You cannot un-deny those.
# A built-in confirm ALWAYS fires for sudo, git push, rm -rf, curl|sh,
# base64 -d|sh, mutating systemctl (verb-aware: status/cat/show/list-* flow,
# start/stop/restart/enable/… confirm), kill/pkill, docker, npm publish,
# package installs — unless you explicitly name the rule under
# `confirm_overrides` below (an allow rule alone does not lift it).

version: 1

# Unmatched mutating tools run silently. Read-only tools (Read/Grep/Glob/...)
# always auto-allow. Set to `confirm` for Variant 2 (tap to approve every edit).
default_tier: allow

# Operator confirm — risky-but-legitimate operations you want to wave through
# by tapping a Telegram button. Add your project's deploy/DB entrypoints here.
confirm:
  bash_patterns:
    - "deploy.sh"
    - "infra/deploy"
    - "psql"
    - "supabase db"
    - "pm2 restart"
    - "pm2 delete"
    - "rsync"          # production sync
  tools:
    - "mcp__*__task_done"   # marking team tasks done is a real-world side effect

# Operator deny — things you never want to happen, even by tap. Optional;
# the built-in hard-deny already covers secrets, catastrophic shell and force
# push (git-force-push: token-aware, catches `git -C . push -f`, `+refspec`,
# --force-with-lease, force-push aliases). Operator patterns are SUBSTRING
# matches on the lowercased command — write them without the `git ` prefix so
# `git -C dir push --force` is still caught.
deny:
  bash_patterns:
    - "push --force"
    - "push -f"
  read_paths:
    - "**/secrets/**"

# Operator allow — explicit forms that should run silently. NOTE: the built-in
# confirm tier is UNCONDITIONAL — it CANNOT be overridden by an allow rule
# (sudo / git push / rm -rf / curl|sh always reach you as a Telegram confirm).
# So an allow rule only takes effect for commands NOT caught by a built-in
# confirm/deny. Keep this list tight.
allow:
  bash_patterns:
    - "gh pr view"     # read-only gh subcommands you want silent
    - "bun test"

# Built-in confirm downgrades (opt-in, off by default). Naming a built-in
# confirm rule here drops it to the normal flow above (confirm -> allow ->
# default_tier). Names must match exactly — a typo fails validation and the
# whole file falls back to confirm-everything. Accepted names: the substring
# rules ("sudo ", "rm -rf ", "rm -fr ", "git push", "git reset --hard",
# "git clean -", "chmod -r", "chown -r", "kill ", "pkill", "docker ",
# "npm publish", "pip install", "apt install", "apt-get install") and two
# named detectors (overridable only by explicit operator opt-in, owner
# decision 2026-10-17):
#   pipe-interpreter  — curl|sh, base64 -d|sh and similar download-and-execute
#   git-exec-surface  — git -c <key>=…, GIT_SSH_COMMAND / GIT_CONFIG_* env,
#                       writes to .git/hooks or .git/config
# A listed detector is lifted for SIMPLE commands only: plain `curl … | sh`,
# `git -c user.name=x commit`. It still confirms on complex forms: nested
# `sh -c` / `python3 -c` / `eval` bodies, git `!`-aliases and alias.* /
# GIT_CONFIG_* definitions, program-running git config or env
# (core.hooksPath, core.fsmonitor, core.sshCommand, credential.helper,
# GIT_SSH_COMMAND, …), --upload-pack / --exec, decode-into-interpreter
# (base64 -d / xxd -r / openssl -d), /dev/tcp, substitution into an
# interpreter, writes to .git/hooks / .git/config / $GIT_DIR. When a lift
# applies, secret-path and catastrophic checks re-run with quote-split words
# joined (`.e""nv` -> `.env`).
# SECURITY TRADE-OFF: a lifted simple download-and-execute still runs code
# you have not seen. The built-in hard-deny (secrets, catastrophic shell,
# own-channel systemctl, force push) and the deny list above are NEVER
# affected. Listing one detector does not relax the other.
# confirm_overrides:
#   builtin_rules:
#     - "git push"
#     - "pipe-interpreter"
#     - "git-exec-surface"

# Per-scope overrides (keyed by CHAT_ID; "main" = the owner's DM session).
# Scope rules are ADDITIVE to the globals above. Example: make the main
# session confirm every package install even if globals allowed it.
# scopes:
#   main:
#     confirm:
#       bash_patterns:
#         - "npm install"
